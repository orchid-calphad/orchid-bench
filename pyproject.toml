[project]
name = "orchid-bench"
version = "0"
description = "ORCHID synthetic-papers benchmark: generator, deterministic baselines and scorer"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.2.6",
    "matplotlib==3.11.2",
    "PyMuPDF==1.28.2",
    "pillow==12.3.0",
    "scipy==1.13.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["bench"]
