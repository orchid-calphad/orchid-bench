name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  MPLBACKEND: Agg

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install pinned lint tools
        run: uv sync --frozen --only-group dev
      - name: ruff check
        run: uv run --frozen --no-sync ruff check .
      - name: ruff format check
        run: uv run --frozen --no-sync ruff format --check .
      - name: Byte-compile bench
        run: python -m compileall -q bench

  test-ubuntu:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install pinned requirements
        run: uv sync --frozen
      - name: pytest
        run: uv run --frozen --no-sync python -m pytest -q

  test-windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install pinned requirements
        run: uv sync --frozen
      - name: pytest
        run: uv run --frozen --no-sync python -m pytest -q
