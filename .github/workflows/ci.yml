name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  MPLBACKEND: Agg

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install pinned lint tools
        run: uv sync --frozen --only-group dev
      - name: ruff check (no new findings)
        # The modules that were not restyled still carry 530 older findings; this step fails when the count grows.
        run: |
          count=$(uv run --frozen --no-sync ruff check . --output-format concise | grep -c ': ' || true)
          echo "ruff findings: $count (baseline 530)"
          test "$count" -le 530
      - name: ruff format check
        run: uv run --frozen --no-sync ruff format --check .
      - name: Byte-compile bench
        run: python -m compileall -q bench

  test-ubuntu:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install pinned requirements
        run: uv sync --frozen
      - name: pytest
        run: uv run --frozen --no-sync python -m pytest -q

  test-windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install pinned requirements
        run: uv sync --frozen
      - name: pytest
        run: uv run --frozen --no-sync python -m pytest -q
