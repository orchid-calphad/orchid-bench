name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  MPLBACKEND: Agg

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned lint tools
        run: python -m pip install ruff==0.16.8
      - name: ruff check
        run: ruff check .
      - name: ruff format check
        run: ruff format --check .
      - name: Byte-compile bench
        run: python -m compileall -q bench

  test-ubuntu:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned requirements
        run: python -m pip install -r requirements-dev.txt
      - name: pytest
        run: python -m pytest -q

  test-windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned requirements
        run: python -m pip install -r requirements-dev.txt
      - name: pytest
        run: python -m pytest -q
